- defaults:
    link:
      relink: true

- clean: ['~']

- link:
    # git
    ~/.gitconfig: .gitconfig

    # editor
    ~/.vimrc: .vimrc
    ~/.ideavimrc: .ideavimrc

    ~/.tmux.conf: .tmux.conf

    # ai
    ~/.claude/skills:
      path: skills
      create: true
      backup: true
    ~/.agents/skills:
      path: skills
      create: true
      backup: true
    ~/.cursor/skills:
      path: skills
      create: true
      backup: true

# - create:

- shell:
  - [git submodule update --init --recursive, Installing submodules]
